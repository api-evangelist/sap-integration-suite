aid: sap-integration-suite
name: SAP Integration Suite
description: >-
  SAP Integration Suite is an enterprise integration platform as a service (iPaaS) that connects applications,
  processes, and people across cloud and on-premises environments. It includes capabilities for Cloud Integration, API
  Management, Integration Advisor, Open Connectors, Trading Partner Management, and Event Mesh as part of SAP Business
  Technology Platform (BTP). It enables seamless connectivity between SAP and non-SAP systems.
type: Index
accessModel:
  pricing: enterprise
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Enterprise · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/sap-integration-suite.png
tags:
