- aid: sap-integration-suite:sap-open-connectors
  name: SAP Open Connectors API
  description: >-
    The SAP Open Connectors API (formerly Cloud Elements) provides a unified REST interface to connect
    to over 160 third-party cloud applications using pre-built connectors. It normalizes disparate API
    endpoints into consistent resource models for faster integration development. Connectors are available
    for CRM, ERP, marketing, storage, and collaboration platforms.
  humanURL: >-
    https://help.sap.com/docs/integration-suite/sap-integration-suite/open-connectors-capability
  baseURL: https://api.openconnectors.ext.hana.ondemand.com
  tags:
  - Cloud Connectors
  - Normalization
  - Open Connectors
  - Third-Party Integration
  - Unified API
  properties:
  - type: Documentation
    url: >-
      https://help.sap.com/docs/integration-suite/sap-integration-suite/open-connectors-capability
  - type: Reference
    url: https://api.sap.com/api/OpenConnectors/overview
  - type: Authentication
    url: >-
      https://help.sap.com/docs/integration-suite/sap-integration-suite/open-connectors-capability
- aid: sap-integration-suite:sap-trading-partner-management
  name: SAP Trading Partner Management API
  description: >-
    The SAP Trading Partner Management API supports setup and management of B2B trading partner relationships,
    agreements, and communication channels within SAP Integration Suite. It enables automation of partner
    onboarding, maintenance of EDI and AS2 communication profiles, and management of certificates and
    agreements.
  humanURL: >-
    https://help.sap.com/docs/integration-suite/sap-integration-suite/trading-partner-management-capability
  baseURL: https://{host}/api
  tags:
  - AS2
