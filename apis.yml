apis:
- aid: sap-integration-suite:sap-integration-advisor
  name: SAP Integration Advisor API
  description: >-
    The SAP Integration Advisor API provides access to the library of message implementation guidelines
    (MIGs) and mapping guidelines (MAGs) used to simplify B2B and A2A integration scenarios. It supports
    querying and managing integration content including type systems, business context, and codelists
    in the Integration Advisor capability.
  humanURL: >-
    https://help.sap.com/docs/integration-suite/sap-integration-suite/integration-advisor-capability
  baseURL: https://{host}/api
  tags:
  - B2B Integration
  - EDI
  - Integration Advisor
  - Mapping Guidelines
  - Message Implementation Guidelines
