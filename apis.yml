- aid: sap-integration-suite:sap-event-mesh
  name: SAP Event Mesh API
  description: >-
    The SAP Event Mesh API provides access to the event brokering service within SAP Business Technology
    Platform that enables applications to communicate through asynchronous events. It supports publishing
    and subscribing to events across SAP and third-party applications using CloudEvents standard and AMQP/MQTT/HTTP
    protocols.
  humanURL: https://help.sap.com/docs/event-mesh
  baseURL: https://enterprise-messaging.cfapps.sap.hana.ondemand.com
  tags:
  - Asynchronous
  - CloudEvents
  - Event Mesh
  - Messaging
  - Pub/Sub
  properties:
  - type: Documentation
    url: https://help.sap.com/docs/event-mesh
  - type: Reference
    url: https://api.sap.com/api/SAPEventMesh/overview
  - type: Authentication
    url: https://help.sap.com/docs/event-mesh/sap-event-mesh/authentication-and-authorization
- aid: sap-integration-suite:sap-integration-suite-advanced-event-mesh
  name: SAP Integration Suite Advanced Event Mesh API
  description: >-
    The SAP Integration Suite Advanced Event Mesh (AEM) REST API provides management capabilities for
    event brokers, message queues, topic subscriptions, and event broker services. It enables programmatic
    management of messaging infrastructure including creation and monitoring of event brokers and messaging
    services.
  humanURL: https://help.pubsub.em.services.cloud.sap/Cloud/cloud-rest-api-lp.htm
  baseURL: https://api.solacecloud.com/api/v2
  tags:
  - Advanced Event Mesh
