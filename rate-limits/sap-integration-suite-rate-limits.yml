description: SAP Integration Suite does not publish public API rate limits reachable in this reconciliation
  pass; limits are governed by the customer's commercial / partner agreement. Consumers should honor 429
  / 503 responses where they appear and follow standard exponential-backoff guidance.
notes: SAP Integration Suite is sold as part of SAP Business Technology Platform (BTP) and priced via
  SAP commercial agreements. The public pricing page returns HTTP 403 to anonymous fetches; Discovery
  Center requires authenticated SAP session. List pricing is not publicly disclosed.
