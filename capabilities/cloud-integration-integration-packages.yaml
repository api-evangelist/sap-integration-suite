naftiko: 1.0.0-alpha2
info:
  label: SAP Cloud Integration API — Integration Packages
  description: 'SAP Cloud Integration API — Integration Packages. 2 operations. Lead operation: List Integration Packages.
    Self-contained Naftiko capability covering one Sap Integration Suite business surface.'
  tags:
  - Sap Integration Suite
  - Integration Packages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_INTEGRATION_SUITE_API_KEY: SAP_INTEGRATION_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-integration-integration-packages
    baseUri: https://{tenant-host}/api/v1
    description: SAP Cloud Integration API — Integration Packages business capability. Self-contained, no shared references.
    resources:
    - name: IntegrationPackages
      path: /IntegrationPackages
      operations:
      - name: listintegrationpackages
        method: GET
        description: List Integration Packages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: $top
          in: query
          type: integer
          description: Maximum number of records to return
        - name: $skip
          in: query
          type: integer
          description: Number of records to skip for pagination
        - name: $filter
          in: query
          type: string
          description: OData filter expression
        - name: $orderby
          in: query
          type: string
          description: OData orderby expression
    - name: IntegrationPackages('{Id}')
      path: /IntegrationPackages('{Id}')
      operations:
      - name: getintegrationpackage
        method: GET
        description: Get Integration Package
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Id
          in: path
          type: string
          description: Integration package identifier
          required: true
    authentication:
      type: bearer
      token: '{{env.SAP_INTEGRATION_SUITE_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-integration-integration-packages-rest
    port: 8080
    description: REST adapter for SAP Cloud Integration API — Integration Packages. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/integrationpackages
      name: integrationpackages
      description: REST surface for IntegrationPackages.
      operations:
      - method: GET
        name: listintegrationpackages
        description: List Integration Packages
        call: cloud-integration-integration-packages.listintegrationpackages
        with:
          $top: rest.$top
          $skip: rest.$skip
          $filter: rest.$filter
          $orderby: rest.$orderby
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/integrationpackages-id
      name: integrationpackages-id
      description: REST surface for IntegrationPackages('{Id}').
      operations:
      - method: GET
        name: getintegrationpackage
        description: Get Integration Package
        call: cloud-integration-integration-packages.getintegrationpackage
        with:
          Id: rest.Id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-integration-integration-packages-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Cloud Integration API — Integration Packages. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-integration-packages
      description: List Integration Packages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-integration-integration-packages.listintegrationpackages
      with:
        $top: tools.$top
        $skip: tools.$skip
        $filter: tools.$filter
        $orderby: tools.$orderby
      outputParameters:
      - type: object
        mapping: $.
    - name: get-integration-package
      description: Get Integration Package
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-integration-integration-packages.getintegrationpackage
      with:
        Id: tools.Id
      outputParameters:
      - type: object
        mapping: $.
