naftiko: 1.0.0-alpha2
info:
  label: SAP Integration Suite - Integration Lifecycle
  description: Unified capability for managing the complete integration lifecycle on SAP Integration Suite. Combines Cloud
    Integration artifact management with API Management proxy lifecycle for integration developers and platform administrators.
    Covers design, deployment, monitoring, and API governance workflows.
  tags:
  - SAP Integration Suite
  - Cloud Integration
  - API Management
  - Integration Flows
  - DevOps
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SAP_CLOUD_INTEGRATION_OAUTH_TOKEN: SAP_CLOUD_INTEGRATION_OAUTH_TOKEN
    SAP_CLOUD_INTEGRATION_HOST: SAP_CLOUD_INTEGRATION_HOST
    SAP_APIM_OAUTH_TOKEN: SAP_APIM_OAUTH_TOKEN
    SAP_APIM_HOST: SAP_APIM_HOST
capability:
  consumes:
  - type: http
    namespace: cloud-integration
    baseUri: https://{{env.SAP_CLOUD_INTEGRATION_HOST}}/api/v1
    description: SAP Cloud Integration OData API for integration flow lifecycle management
    authentication:
      type: bearer
      token: '{{env.SAP_CLOUD_INTEGRATION_OAUTH_TOKEN}}'
    resources:
    - name: integration-packages
      path: /IntegrationPackages
      description: Manage integration packages
      operations:
      - name: list-integration-packages
        method: GET
        description: Retrieve all integration packages in the tenant
        inputParameters:
        - name: $top
          in: query
          type: integer
          required: false
          description: Maximum number of records
        - name: $skip
          in: query
          type: integer
          required: false
          description: Number of records to skip
        - name: $filter
          in: query
          type: string
          required: false
          description: OData filter expression
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-integration-package
        method: GET
        description: Retrieve a specific integration package
        inputParameters:
        - name: Id
          in: path
          type: string
          required: true
          description: Package identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: integration-flows
      path: /IntegrationDesigntimeArtifacts
      description: Manage integration flow design-time artifacts
      operations:
      - name: get-integration-flow
        method: GET
        description: Retrieve a specific design-time integration flow artifact
        inputParameters:
        - name: Id
          in: path
          type: string
          required: true
          description: Artifact identifier
        - name: Version
          in: path
          type: string
          required: true
          description: Artifact version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: deploy-integration-flow
      path: /DeployIntegrationDesigntimeArtifact
      description: Deploy integration flows to runtime
      operations:
      - name: deploy-integration-flow
        method: POST
        description: Deploy an integration flow artifact to the runtime
        inputParameters:
        - name: Id
          in: query
          type: string
          required: true
          description: Artifact ID to deploy
        - name: Version
          in: query
          type: string
          required: true
          description: Artifact version to deploy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: runtime-artifacts
      path: /IntegrationRuntimeArtifacts
      description: Monitor deployed runtime artifacts
      operations:
      - name: list-runtime-artifacts
        method: GET
        description: List all deployed runtime artifacts and their status
        inputParameters:
        - name: $filter
          in: query
          type: string
          required: false
          description: OData filter expression
        - name: $top
          in: query
          type: integer
          required: false
          description: Maximum records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-runtime-artifact
        method: GET
        description: Get a specific runtime artifact and its deployment status
        inputParameters:
        - name: Id
          in: path
          type: string
          required: true
          description: Runtime artifact identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: undeploy-runtime-artifact
        method: DELETE
        description: Remove a deployed artifact from the runtime
        inputParameters:
        - name: Id
          in: path
          type: string
          required: true
          description: Runtime artifact identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: message-processing-logs
      path: /MessageProcessingLogs
      description: Retrieve and analyze message processing logs
      operations:
      - name: list-message-processing-logs
        method: GET
        description: Retrieve message processing logs with optional filtering
        inputParameters:
        - name: $filter
          in: query
          type: string
          required: false
          description: OData filter (e.g., Status eq 'FAILED')
        - name: $top
          in: query
          type: integer
          required: false
          description: Max log entries
        - name: $skip
          in: query
          type: integer
          required: false
          description: Skip for pagination
        - name: $orderby
          in: query
          type: string
          required: false
          description: OData orderby expression
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-message-processing-log
        method: GET
        description: Retrieve a specific message processing log by GUID
        inputParameters:
        - name: MessageGuid
          in: path
          type: string
          required: true
          description: Message GUID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: service-endpoints
      path: /ServiceEndpoints
      description: Discover and list service endpoints
      operations:
      - name: list-service-endpoints
        method: GET
        description: Retrieve all service endpoints registered in the tenant
        inputParameters:
        - name: $top
          in: query
          type: integer
          required: false
          description: Maximum records
        - name: $skip
          in: query
          type: integer
          required: false
          description: Skip for pagination
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: api-management
    baseUri: https://{{env.SAP_APIM_HOST}}/apiportal/api/1.0
    description: SAP API Management REST API for full API lifecycle management
    authentication:
      type: bearer
      token: '{{env.SAP_APIM_OAUTH_TOKEN}}'
    resources:
    - name: api-proxies
      path: /Management/APIProxies
      description: Manage API proxy configurations
      operations:
      - name: list-api-proxies
        method: GET
        description: List all API proxies in the tenant
        inputParameters:
        - name: $top
          in: query
          type: integer
          required: false
          description: Max results
        - name: $skip
          in: query
          type: integer
          required: false
          description: Skip for pagination
        - name: $filter
          in: query
          type: string
          required: false
          description: OData filter expression
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-api-proxy
        method: POST
        description: Create a new API proxy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            title: '{{tools.title}}'
            targetEndpoint: '{{tools.targetEndpoint}}'
      - name: get-api-proxy
        method: GET
        description: Get a specific API proxy by name
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: API proxy name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-api-proxy
        method: DELETE
        description: Delete an API proxy
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: API proxy name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-products
      path: /Management/APIProducts
      description: Manage API products bundling API proxies
      operations:
      - name: list-api-products
        method: GET
        description: List all API products
        inputParameters:
        - name: $top
          in: query
          type: integer
          required: false
          description: Max results
        - name: $skip
          in: query
          type: integer
          required: false
          description: Skip for pagination
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-api-product
        method: GET
        description: Get a specific API product by name
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: API product name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: applications
      path: /Management/Applications
      description: Manage developer applications
      operations:
      - name: list-applications
        method: GET
        description: List all developer applications
        inputParameters:
        - name: $top
          in: query
          type: integer
          required: false
          description: Max results
        - name: $filter
          in: query
          type: string
          required: false
          description: OData filter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-application
        method: GET
        description: Get a specific application by ID
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: Application identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: developers
      path: /Management/Developers
      description: Manage developer accounts
      operations:
      - name: list-developers
        method: GET
        description: List all registered developers
        inputParameters:
        - name: $top
          in: query
          type: integer
          required: false
          description: Max results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: integration-lifecycle-api
    description: Unified REST API for SAP Integration Suite lifecycle management.
    resources:
    - path: /v1/integration-packages
      name: integration-packages
      description: List and retrieve integration packages
      operations:
      - method: GET
        name: list-integration-packages
        description: List all integration packages
        call: cloud-integration.list-integration-packages
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/integration-packages/{id}
      name: integration-package
      description: Single integration package details
      operations:
      - method: GET
        name: get-integration-package
        description: Get a specific integration package
        call: cloud-integration.get-integration-package
        with:
          Id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/runtime-artifacts
      name: runtime-artifacts
      description: Deployed integration flow runtime artifacts
      operations:
      - method: GET
        name: list-runtime-artifacts
        description: List all deployed runtime artifacts
        call: cloud-integration.list-runtime-artifacts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/runtime-artifacts/{id}
      name: runtime-artifact
      description: Single runtime artifact status
      operations:
      - method: GET
        name: get-runtime-artifact
        description: Get runtime artifact status
        call: cloud-integration.get-runtime-artifact
        with:
          Id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: undeploy-runtime-artifact
        description: Undeploy a runtime artifact
        call: cloud-integration.undeploy-runtime-artifact
        with:
          Id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/deploy
      name: deploy
      description: Trigger integration flow deployment
      operations:
      - method: POST
        name: deploy-integration-flow
        description: Deploy an integration flow to runtime
        call: cloud-integration.deploy-integration-flow
        with:
          Id: rest.id
          Version: rest.version
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/message-processing-logs
      name: message-processing-logs
      description: Message processing audit logs
      operations:
      - method: GET
        name: list-message-processing-logs
        description: List message processing logs
        call: cloud-integration.list-message-processing-logs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/message-processing-logs/{messageGuid}
      name: message-processing-log
      description: Single message processing log
      operations:
      - method: GET
        name: get-message-processing-log
        description: Get a specific message log
        call: cloud-integration.get-message-processing-log
        with:
          MessageGuid: rest.messageGuid
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/service-endpoints
      name: service-endpoints
      description: Integration service endpoints
      operations:
      - method: GET
        name: list-service-endpoints
        description: List all service endpoints
        call: cloud-integration.list-service-endpoints
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api-proxies
      name: api-proxies
      description: API Management proxy configurations
      operations:
      - method: GET
        name: list-api-proxies
        description: List all API proxies
        call: api-management.list-api-proxies
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api-proxies/{name}
      name: api-proxy
      description: Single API proxy configuration
      operations:
      - method: GET
        name: get-api-proxy
        description: Get API proxy details
        call: api-management.get-api-proxy
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-api-proxy
        description: Delete an API proxy
        call: api-management.delete-api-proxy
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api-products
      name: api-products
      description: API products bundling API proxies
      operations:
      - method: GET
        name: list-api-products
        description: List all API products
        call: api-management.list-api-products
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/applications
      name: applications
      description: Developer applications and subscriptions
      operations:
      - method: GET
        name: list-applications
        description: List all developer applications
        call: api-management.list-applications
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/developers
      name: developers
      description: Developer accounts in API portal
      operations:
      - method: GET
        name: list-developers
        description: List all developers
        call: api-management.list-developers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: integration-lifecycle-mcp
    transport: http
    description: MCP server for AI-assisted SAP Integration Suite lifecycle management.
    tools:
    - name: list-integration-packages
      description: List all integration packages in the SAP Cloud Integration tenant
      hints:
        readOnly: true
        openWorld: true
      call: cloud-integration.list-integration-packages
      outputParameters:
      - type: object
        mapping: $.
    - name: get-integration-package
      description: Get a specific SAP integration package by ID
      hints:
        readOnly: true
        openWorld: false
      call: cloud-integration.get-integration-package
      with:
        Id: tools.Id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-runtime-artifacts
      description: List all deployed runtime integration artifacts and their status
      hints:
        readOnly: true
        openWorld: true
      call: cloud-integration.list-runtime-artifacts
      outputParameters:
      - type: object
        mapping: $.
    - name: get-runtime-artifact
      description: Get the deployment status of a specific integration flow
      hints:
        readOnly: true
        openWorld: false
      call: cloud-integration.get-runtime-artifact
      with:
        Id: tools.Id
      outputParameters:
      - type: object
        mapping: $.
    - name: deploy-integration-flow
      description: Deploy an integration flow artifact to the SAP Integration Suite runtime
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloud-integration.deploy-integration-flow
      with:
        Id: tools.Id
        Version: tools.Version
      outputParameters:
      - type: object
        mapping: $.
    - name: undeploy-runtime-artifact
      description: Remove a deployed integration flow from the runtime
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cloud-integration.undeploy-runtime-artifact
      with:
        Id: tools.Id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-message-processing-logs
      description: List message processing logs, optionally filtered by status or flow name
      hints:
        readOnly: true
        openWorld: true
      call: cloud-integration.list-message-processing-logs
      outputParameters:
      - type: object
        mapping: $.
    - name: get-message-processing-log
      description: Get a specific message processing log entry by GUID
      hints:
        readOnly: true
        openWorld: false
      call: cloud-integration.get-message-processing-log
      with:
        MessageGuid: tools.MessageGuid
      outputParameters:
      - type: object
        mapping: $.
    - name: list-service-endpoints
      description: List all service endpoints registered in SAP Integration Suite
      hints:
        readOnly: true
        openWorld: true
      call: cloud-integration.list-service-endpoints
      outputParameters:
      - type: object
        mapping: $.
    - name: list-api-proxies
      description: List all API proxies in the SAP API Management tenant
      hints:
        readOnly: true
        openWorld: true
      call: api-management.list-api-proxies
      outputParameters:
      - type: object
        mapping: $.
    - name: get-api-proxy
      description: Get a specific API proxy configuration by name
      hints:
        readOnly: true
        openWorld: false
      call: api-management.get-api-proxy
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: create-api-proxy
      description: Create a new API proxy in SAP API Management
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: api-management.create-api-proxy
      with:
        name: tools.name
        title: tools.title
        targetEndpoint: tools.targetEndpoint
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-api-proxy
      description: Delete an API proxy from SAP API Management
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: api-management.delete-api-proxy
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: list-api-products
      description: List all API products in the SAP API Management developer portal
      hints:
        readOnly: true
        openWorld: true
      call: api-management.list-api-products
      outputParameters:
      - type: object
        mapping: $.
    - name: get-api-product
      description: Get a specific API product by name
      hints:
        readOnly: true
        openWorld: false
      call: api-management.get-api-product
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: list-applications
      description: List all developer applications registered in the API portal
      hints:
        readOnly: true
        openWorld: true
      call: api-management.list-applications
      outputParameters:
      - type: object
        mapping: $.
    - name: list-developers
      description: List all developers registered in the SAP API Management portal
      hints:
        readOnly: true
        openWorld: true
      call: api-management.list-developers
      outputParameters:
      - type: object
        mapping: $.
