description: 'FOCUS-aligned FinOps shape for SAP Integration Suite: BTP-hosted iPaaS billed under the
  customer''s SAP BTP commercial agreement (CPEA / Pay-As-You-Go-for-SAP-BTP). No public unit pricing.'
notes: SAP Integration Suite is sold as part of SAP Business Technology Platform (BTP) and priced via
  SAP commercial agreements. The public pricing page returns HTTP 403 to anonymous fetches; Discovery
  Center requires authenticated SAP session. List pricing is not publicly disclosed.
