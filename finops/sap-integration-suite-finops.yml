principles:
- name: Visibility
  description: Consumption visibility comes from the SAP Integration Suite account / partner reporting
    surface (invoices, account dashboards) rather than a public usage API.
- name: Allocation
  description: Allocate cost through the SAP Integration Suite contract structure (entitlement, project,
    business unit) and reconcile against internal cost centers.
- name: Optimization
  description: 'Optimization levers are commercial: renegotiation cadence, commitment sizing, and consolidation
    of SAP Integration Suite entitlements.'
- name: Accountability
  description: Assign a contract owner who reconciles SAP Integration Suite invoices against contracted
    entitlements each billing cycle.
