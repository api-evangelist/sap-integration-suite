      - Open Connectors
      - Third-Party Integration
      - Unified API
    serviceName: SAP Open Connectors API
    serviceCategory: API
  - name: SAP Trading Partner Management API
    baseURL: https://{host}/api
    tags:
      - AS2
      - B2B
      - EDI
      - Trading Partner Management
    serviceName: SAP Trading Partner Management API
    serviceCategory: API
  - name: SAP Event Mesh API
