openapi: 3.2.0
info:
  title: SAP Cloud Integration Variables API
  description: The SAP Cloud Integration API (Process Integration Runtime API) provides OData V2 and REST endpoints for deploying, monitoring, and managing integration flows, artifacts, packages, and runtime operations on SAP Integration Suite hosted on SAP Business Technology Platform. It supports message processing log retrieval, integration package lifecycle management, artifact deployment, and service endpoint discovery.
  version: 1.0.0
  contact:
    name: SAP Support
    url: https://support.sap.com
  license:
    name: SAP Developer License
    url: https://www.sap.com/about/agreements/product-use-and-support-terms.html
  x-logo:
    url: https://www.sap.com/dam/application/shared/logos/sap-logo.svg
servers:
- url: https://{tenant-host}/api/v1
  description: SAP Integration Suite Tenant
  variables:
    tenant-host:
      default: my-tenant.integrationsuite.cfapps.sap.hana.ondemand.com
      description: SAP Integration Suite tenant host
security:
- oauth2: []
tags:
- name: Variables
  description: Manage global and local variables
paths:
  /Variables:
    get:
      operationId: listVariables
      summary: List Variables
      description: Retrieve all integration variables defined in the tenant.
      tags:
      - Variables
      parameters:
      - name: $filter
        in: query
        schema:
          type: string
      - name: $top
        in: query
        schema:
          type: integer
      - name: $skip
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: List of variables
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Variable'
        '401':
          description: Unauthorized
components:
  schemas:
    Variable:
      type: object
      properties:
        VariableName:
          type: string
          description: Name of the variable
        IntegrationFlow:
          type: string
          description: Associated integration flow name (empty for global variables)
        Visibility:
          type: string
          description: Variable scope
          enum:
          - Global
          - Local
        UpdatedAt:
          type: string
          description: Last updated timestamp
        RetainUntil:
          type: string
          description: Retention expiry timestamp
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{tenant}.authentication.sap.hana.ondemand.com/oauth/token
          scopes: {}
