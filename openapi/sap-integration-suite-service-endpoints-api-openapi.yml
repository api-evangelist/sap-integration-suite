openapi: 3.2.0
info:
  title: SAP Cloud Integration Service Endpoints API
  description: The SAP Cloud Integration API (Process Integration Runtime API) provides OData V2 and REST endpoints for deploying, monitoring, and managing integration flows, artifacts, packages, and runtime operations on SAP Integration Suite hosted on SAP Business Technology Platform. It supports message processing log retrieval, integration package lifecycle management, artifact deployment, and service endpoint discovery.
  version: 1.0.0
  contact:
    name: SAP Support
    url: https://support.sap.com
  license:
    name: SAP Developer License
    url: https://www.sap.com/about/agreements/product-use-and-support-terms.html
  x-logo:
    url: https://www.sap.com/dam/application/shared/logos/sap-logo.svg
servers:
- url: https://{tenant-host}/api/v1
  description: SAP Integration Suite Tenant
  variables:
    tenant-host:
      default: my-tenant.integrationsuite.cfapps.sap.hana.ondemand.com
      description: SAP Integration Suite tenant host
security:
- oauth2: []
tags:
- name: Service Endpoints
  description: Discover and manage service endpoints
paths:
  /ServiceEndpoints:
    get:
      operationId: listServiceEndpoints
      summary: List Service Endpoints
      description: Retrieve all service endpoints registered in the Integration Suite tenant. Supports pagination with $top and $skip parameters.
      tags:
      - Service Endpoints
      parameters:
      - name: $top
        in: query
        schema:
          type: integer
      - name: $skip
        in: query
        schema:
          type: integer
      - name: $count
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: List of service endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceEndpoint'
        '401':
          description: Unauthorized
components:
  schemas:
    ServiceEndpoint:
      type: object
      properties:
        Name:
          type: string
          description: Service endpoint name
        Id:
          type: string
          description: Service endpoint identifier
        Title:
          type: string
          description: Endpoint title
        Protocol:
          type: string
          description: Communication protocol (e.g., HTTPS, AS2)
        Url:
          type: string
          description: Endpoint URL
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{tenant}.authentication.sap.hana.ondemand.com/oauth/token
          scopes: {}
